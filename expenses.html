
<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCar - Expenses & Split</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">דף הבית</a>
            <a href="expenses.html">הוצאות הרכב</a>
            <a href="maintenance.html">תחזוקה ותזכורות</a>
            <a href="passport.html">תיק הרכב</a>
        </nav>
    </header>

    <main>
        <h1>הוצאות הרכב</h1>
        <div class="expenses-layout">

<section id="add-expense" class="card">
    <h2>הוספת הוצאה חדשה</h2>

    <button type="button" id="open-expense-modal">
        + הוספת הוצאה
    </button>

    <div id="expense-modal" class="modal" hidden>
   
       <div class="modal-content">
    <h3>פרטי הוצאה חדשה</h3>
    <button type="button" id="close-expense-modal">
        ביטול
    </button>
           
            <form id="expense-form">

               <div class="expense-form-fields">

    <div class="form-field">
        <label for="expense-name">שם ההוצאה:</label>
        <input type="text" id="expense-name"
               name="expenseName" required>
    </div>

    <div class="form-field">
        <label for="amount">סכום ההוצאה:</label>
        <input type="number" id="amount"
               name="amount" min="0.01"
               step="0.01" required>
    </div>

    <div class="form-field">
        <label for="category">קטגוריית ההוצאה:</label>
        <select id="category" name="category" required>
            <option value="">בחרי קטגוריה</option>
            <option value="fuel">דלק</option>
            <option value="insurance">ביטוח</option>
            <option value="maintenance">טיפול</option>
            <option value="repair">תיקון</option>
            <option value="other">אחר</option>
        </select>
    </div>

    <div class="form-field">
        <label for="expense-date">תאריך ההוצאה:</label>
        <input type="date" id="expense-date"
               name="expenseDate" required>
    </div>

</div>

                <button type="button" id="show-description"> + הוספת תיאור נוסף                
                </button>


                <div id="description-container" hidden>
                    <label for="description">תיאור ההוצאה:</label>
                    <textarea id="description"
                              name="description"></textarea>
                </div>

                <div id="split-section">
                     <h3>Split - חלוקת ההוצאה</h3>

                    <label for="payer">מי שילם את ההוצאה?</label>
                        <select id="payer" name="payer" required>
                          <option value="">בחרי משלם</option>
                      </select>

                    <h4>משתתפים בהוצאה:</h4>
                         <div id="participants-list">
                        <!-- JavaScript תוסיף כאן את הנהגים -->
                         </div>

                    <h4>חלוקת הסכום בין המשתתפים:</h4>
                        <div id="split-amounts">
                            <!-- כאן יתווספו שדות הסכומים -->
                        </div>

                        <p id="split-total">סה"כ חלוקה: ₪0.00</p>
                        <p id="split-error"></p>
                </div>

                <button type="submit">חשב ושמור</button>

            </form>
                  </div> <!-- modal-content -->
                  </div> <!-- expense-modal -->
                 <p id="form-message" role="status"></p>
        </section>
            <div class="expenses-summary-column">

      <section id="monthly-summary" class="card">
             <h2>סיכום הוצאות חודשי</h2>
             <p id="monthly-total">₪0.00</p>
             <div id="category-summary">
                 <!-- JavaScript תציג כאן סיכום לפי קטגוריות -->
             </div>
        </section>

        
<section id="balances" class="card">
            <h2>היתרות שלי</h2>

                 <div id="balances-list">
                    <!-- JavaScript תציג כאן יתרה מול כל נהג -->
                </div>

            <h3>יתרה כוללת</h3>
                <p id="net-balance">₪0.00</p>

        </section>


        
<section id="expense-history" class="card">
    <h2>היסטוריית הוצאות</h2>

    <label for="filter-category">סינון לפי קטגוריה:</label>
    <select id="filter-category">
        <option value="all">כל הקטגוריות</option>
        <option value="fuel">דלק</option>
        <option value="insurance">ביטוח</option>
        <option value="maintenance">טיפול</option>
        <option value="repair">תיקון</option>
        <option value="other">אחר</option>
    </select>

    <table id="expenses-table">

        <tr>
            <th>שם ההוצאה</th>
            <th>קטגוריה</th>
            <th>סכום</th>
            <th>תאריך</th>
            <th>פעולות</th>
        </tr>
    </table>

</section>

                    </div> <!-- expenses-summary-column -->
</div> <!-- expenses-layout -->

    </main>

    <script src="expenses.js"></script>
</body>


</html>
